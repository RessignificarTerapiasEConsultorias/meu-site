<head>
<meta charset="UTF-8">

<title>Raio-X Empresarial · Ressignificar</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--n:#021f49;--n2:#0a3069;--c:#3fd9e8;--b:#1f6fd1;--bg:#eef3f9;--t:#10233f;--m:#566782;--l:#d3deec}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.55 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{position:sticky;top:0;z-index:5;background:var(--n);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 12px;display:flex;align-items:center;gap:12px}
.top img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 12%}
.top b{font:600 18px Newsreader,Georgia,serif;letter-spacing:.02em}.top small{display:block;color:#9fb6d8;font-size:13px}
#bar{position:absolute;left:0;bottom:0;height:3px;background:var(--c);width:0}
.card{max-width:640px;margin:22px auto;background:#fff;border:1px solid var(--l);border-radius:16px;padding:28px}
.hero{max-width:640px;margin:22px auto;background:var(--n);color:#fff;border-radius:16px;padding:32px 28px;text-align:center}
.hero img{width:190px;max-width:60%;border-radius:12px}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;line-height:1.25;margin:0 0 10px}
h1{font-size:34px}h2{font-size:25px}h3{font-size:19px}
.hero p{color:#c9d8ee;margin:8px auto;max-width:460px}
.h{color:var(--m);font-size:14px;margin:0 0 14px}.pos{color:var(--b);font-weight:600;font-size:14px}
.dots{display:flex;gap:5px;margin:8px 0 18px}.dots i{height:4px;flex:1;max-width:28px;border-radius:3px;background:var(--l)}.dots .f{background:var(--n)}.dots .c{background:var(--c)}
.ops{display:grid;gap:10px;margin:16px 0}
.op{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 16px;border:1.5px solid var(--l);border-radius:12px;background:#fff;color:var(--t);font:500 16px/1.4 Figtree,sans-serif}
.op:hover{border-color:var(--b)}.op.on{background:var(--n);color:#fff;border-color:var(--n);box-shadow:inset 5px 0 0 var(--c)}
.op b{display:block;font-weight:600}.op small{display:block;opacity:.8;font-size:14px;margin-top:2px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--c);outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;padding:12px 14px;border:1.5px solid var(--l);border-radius:10px;font:inherit;color:var(--t)}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:18px}.ck input{margin-top:5px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.bk,.nx,.bt{all:unset;cursor:pointer;box-sizing:border-box;padding:12px 22px;border-radius:10px;font:600 16px Figtree,sans-serif;text-align:center}
.bk{color:var(--m);border:1.5px solid var(--l)}.nx,.bt{background:var(--n);color:#fff}.nx:disabled{opacity:.35;cursor:default}
.bt.alt{background:#fff;color:var(--n);border:1.5px solid var(--n)}.hero .bt{background:var(--c);color:var(--n);margin-top:18px}
.sc{border:1px solid var(--l);border-radius:12px;padding:14px;margin-top:12px;background:#f8fbfe}
.sc .r{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.sc .r button{padding:8px 12px;font-size:14px}
.bar{height:10px;background:var(--l);border-radius:6px;margin:6px 0 14px}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--c));border-radius:6px}
.row{display:flex;justify-content:space-between;font-weight:600;gap:10px}.row span{color:var(--m);font-weight:500}
.ring{--p:0;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#dce6f3 0);display:grid;place-items:center;flex:none}
.ring span{width:100px;height:100px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 32px Newsreader,serif}
.aut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.tg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--n);color:#fff;padding:12px 18px;border-radius:10px;z-index:9;max-width:90%}
.fim{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.fim a{text-decoration:none}
.rec{font-size:13px;color:var(--m);text-align:center;margin:0 0 30px}.rec button{all:unset;cursor:pointer;text-decoration:underline}
.tl{all:unset;cursor:pointer;color:#9fb6d8;font-size:14px;margin-left:14px}.tl.m{margin-left:auto}
.er{display:block;color:#b3261e;font-size:13px}.g2{display:grid;grid-template-columns:1fr 2fr;gap:12px}select{width:100%;padding:12px 14px;border:1.5px solid var(--l);border-radius:10px;font:inherit;background:#fff;color:var(--t)}.card ul,.card ol{padding-left:20px;margin:6px 0}.sc ul{margin:8px 0 0}.pas{text-align:left;max-width:460px;margin:16px auto 0;background:var(--n2);border-radius:12px;padding:14px 18px;color:#c9d8ee;font-size:15px}.pas ol{margin:6px 0 0;padding-left:20px}.pas li{margin:4px 0}@media(max-width:520px){.g2{grid-template-columns:1fr}}
@media(max-width:700px){#demo{position:static!important;max-width:none!important;margin:12px}}
@media print{.tl,.fim,.nav,.tg,#demo{display:none}.card{border:0;margin:0}.top{position:static;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:520px){.card{margin:12px;padding:20px}.hero{margin:12px;padding:26px 20px}h1{font-size:28px}h2{font-size:22px}}
</style>
</head>

 ctx();const L=["intro","eu","papel","soc"];
 if(S.a.soc>0){L.push("stipo","s1","s2","s3","s4","s5");if(S.a.stipo===0)L.push("s6")}
 L.push("ramo","tempo","fat","unid","func");

const sc=id=>{const x=Q[id],v=S.a[id];return v==null||!/s/.test(x.f)||x.o.length<2?null:v/(x.o.length-1)};
const avg=a=>a.length?Math.round(100*a.reduce((s,x)=>s+x,0)/a.length):null;
function scores(){const L=list(),r={};
 AO.filter(a=>S.areas.includes(a)).forEach(a=>{const v=avg(qs(a).map(x=>sc(x.id)).filter(x=>x!=null));if(v!=null)r[a]=v});

function can(){const k=S.cur,E=S.eu,x=Q[k];
 if(k=="eu")return(E.n||"").trim().length>2&&okFone(E.w)&&okEmail(E.e)&&(E.emp||"").trim().length>1&&E.uf&&(E.c||"").trim().length>1&&E.ok;
 if(k=="soc")return S.a.soc!=null&&(S.a.soc==0||S.soc.length>0&&S.soc.every(s=>s.n&&s.n.trim().length>1&&(!s.w||okFone(s.w))));
 if(k=="areas")return S.areas.length>0;
 if(x){const v=S.a[k];if(Array.isArray(v)?!v.length:v==null)return false;const ot=x.o.indexOf("Outro");return ot<0||!(Array.isArray(v)?v.includes(ot):v==ot)||((S.ot||{})[k]||"").trim().length>1}
 return true}
